name: Feature request
description: 建议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你的使用场景和期望方案，帮助我们评估优先级。
  - type: textarea
    id: background
    attributes:
      label: 背景 / 要解决的问题
      description: 你在什么使用场景下遇到了什么痛点？当前是怎么绕过去的？
      placeholder: 我在 xxx 场景下，需要 xxx，但目前 PicoOffice 不支持 / 做起来很麻烦……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 你希望 PicoOffice 提供怎样的能力或交互？
      placeholder: 希望增加一个 xxx 功能，点击后可以 xxx……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 截图、参考产品、相关链接等任何补充材料
