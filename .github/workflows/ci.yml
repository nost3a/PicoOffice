name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go.mod 声明 go 1.26.0（golang.org/x/crypto v0.57.0 要求 Go >= 1.26）
      # 此处必须 >= 1.26，否则 GOTOOLCHAIN=auto 会尝试下载工具链并导致构建失败
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure GOPROXY
        run: go env -w GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct

      # go:embed all:web 需要前端产物；先编译前端并拷入 backend/web，再编译 Go
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmmirror.com"

      - name: Build frontend
        working-directory: frontend-web
        run: |
          npm ci || npm install || (npm config set registry https://registry.npmjs.org/ && npm install)
          npm run build

      - name: Copy frontend dist into backend/web
        working-directory: .
        run: |
          rm -f backend/web/index.html
          cp -r frontend-web/dist/. backend/web/

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  web:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmmirror.com"

      - name: Install dependencies
        # 优先 npm ci（有 lockfile），失败则 npm install；镜像源失败时回退官方源
        run: |
          npm ci || npm install || (npm config set registry https://registry.npmjs.org/ && npm install)

      - name: Build
        run: npm run build

  # 可选：Docker 镜像构建（默认注释，需要时取消注释即可）
